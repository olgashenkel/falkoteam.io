    <!-- Стили конкретно для этой страницы (можно вынести в css/article.css) -->
<style>
  .article-view {
    max-width: 800px;
    margin: 40px auto;
    padding: 0 20px;
    font-family: 'Montserrat', sans-serif;
  }
  .article-view__back {
    display: inline-flex;
    align-items: center;
    margin-bottom: 25px;
    color: #555;
    text-decoration: none;
    font-weight: 700;
    font-size: 15px;
    transition: color 0.2s ease;
  }
  .article-view__back:hover {
    color: #ff4757;
  }
  .article-view__title {
    font-family: 'Lato', sans-serif;
    font-size: 36px;
    font-weight: 900;
    line-height: 1.3;
    margin: 0 0 15px 0;
    color: #111;
  }
  .article-view__meta {
    font-size: 14px;
    color: #777;
    margin-bottom: 25px;
  }

  /* ГИБКИЙ КОНТЕЙНЕР ГАЛЕРЕИ */
  .article-view__gallery {
    display: flex;
    flex-wrap: wrap;
    justify-content: center; /* Центрирует картинки по горизонтали */
    gap: 15px;
    margin: 25px 0;
    width: 100%;
  }

  /* ОБЕРТКА ДЛЯ ФОТОГРАФИЙ */
  .article-view__image-wrap {
    flex: 1 1 240px; /* Позволяет картинкам сжиматься/растягиваться адаптивно */
    max-width: 100%;
    border-radius: 8px;
    overflow: hidden;
    background-color: #f8f9fa; /* Мягкий фон для пустых зон, если пропорции фото разные */
    box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    transition: transform 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Кнопка интерактивного наведения */
  .article-view__image-wrap:hover {
    transform: scale(1.02);
  }

  /* ПРАВИЛО ДЛЯ ОДИНОЧНОЙ КАРТИНКИ (Она не растягивается и не обрезается) */
  .article-view__gallery :only-child {
    flex: 0 1 500px; /* Максимальная ширина одиночного фото на странице */
    background-color: transparent; /* Убираем фон, если фото одно */
    box-shadow: none; /* Убираем лишние тени для чистоты дизайна */
  }

  /* САМА ФОТОГРАФИЯ (Универсальное поведение) */
  .article-view__image {
    width: 100%;
    height: auto;
    max-height: 450px;
    display: block;
    object-fit: contain; /* ГАРАНТИРУЕТ, ЧТО КАРТИНКА НИКОГДА НЕ БУДЕТ ОБРЕЗАНА */
  }

  /* НАСТРОЙКА ДЛЯ СЛУЧАЯ, КОГДА КАРТИНОК НЕСКОЛЬКО (Выравниваем высоту рядов) */
  .article-view__gallery:not(:has(:only-child)) .article-view__image-wrap {
    height: 250px; /* Задаем фиксированную высоту рамки для ровной сетки */
  }
  
  .article-view__gallery:not(:has(:only-child)) .article-view__image {
    width: 100%;
    height: 100%;
  }

  .article-view__text {
    font-size: 18px;
    line-height: 1.8;
    color: #2c3e50;
    white-space: pre-wrap;
    text-align: justify;
    margin-top: 30px;
  }
  .article-view__error {
    text-align: center;
    padding: 50px 0;
  }
  .article-view__error-text {
    color: #ff4757;
    font-size: 20px;
    font-weight: 700;
  }
</style>

<body>
    <site-header></site-header>

    <main class="main-content">
        <section class="section-index">
            <div class="article-view">
                <a href="./index.html" class="article-view__back">← Назад к главной ленте</a>

                <div id="article-container">
                    <div class="news1-spinner">Загрузка публикации...</div>
                </div>
            </div>
            <hr class="gradient-line">
        </section>
    </main>

    <scroll-to-top></scroll-to-top>
    <site-footer></site-footer>

    <script>
        // Путь к файлу с вашими собственными новостями
        const DATA_PATH = 'json/section_news1_index.json';

async function loadArticle() {
    const container = document.getElementById('article-container');
    if (!container) return;

    const urlParams = new URLSearchParams(window.location.search);
    const articleId = urlParams.get('id');

    if (!articleId) {
        renderError(container, 'Идентификатор статьи не указан.');
        return;
    }

    try {
        const response = await fetch(DATA_PATH);
        if (!response.ok) throw new Error(`Ошибка сети: ${response.status}`);
        
        const newsItems = await response.json();
        const article = newsItems.find(item => item && String(item.id) === String(articleId));

        if (!article) {
            renderError(container, 'Материал не найден или был удален.');
            return;
        }

        const title = article.title ? article.title.trim() : 'Без названия';
        const date = article.date ? article.date.trim() : '';
        const alt = article.alt || title;
        const text = article.fullText || article.text || 'Текст публикации отсутствует.';

        document.title = `${title} — Тхэквондо`;

        // ГИБКАЯ ПРОВЕРКА КАРТИНОК: Собираем все изображения в один массив
        let imagesArray = [];
        if (Array.isArray(article.images) && article.images.length > 0) {
            // Если в JSON массив картинок (новый формат)
            imagesArray = article.images;
        } else if (article.image) {
            // Если в JSON одиночная строка (старый формат) — превращаем её в массив из 1 элемента
            imagesArray = [article.image];
        }

        // Генерируем HTML-код для галереи
        const galleryHTML = imagesArray.map(imgUrl => `
            <div class="article-view__image-wrap">
                <img src="${escapeHTML(imgUrl)}" alt="${escapeHTML(alt)}" class="article-view__image" loading="lazy">
            </div>
        `).join('');

        // Собираем страницу воедино
        container.innerHTML = `
            <h1 class="article-view__title">${escapeHTML(title)}</h1>
            
            ${date ? `<div class="article-view__meta">Опубликовано: ${escapeHTML(date)}</div>` : ''}
            
            ${imagesArray.length > 0 ? `
            <div class="article-view__gallery">
                ${galleryHTML}
            </div>
            ` : ''}
            
            <div class="article-view__text">${escapeHTML(text)}</div>
        `;

    } catch (error) {
        console.error(error);
        renderError(container, 'Не удалось загрузить текст новости.');
    }
}


        function renderError(container, message) {
            container.innerHTML = `
            <div class="article-view__error">
                <p class="article-view__error-text">${escapeHTML(message)}</p>
                <a href="./index.html" style="color: #555;">Вернуться на главную</a>
            </div>`;
        }

        // Безопасный escapeHTML (аналогичный вашему)
        function escapeHTML(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        document.addEventListener('DOMContentLoaded', loadArticle);
    </script>
</body>
